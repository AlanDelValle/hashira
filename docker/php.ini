; Production PHP settings. The image is the code, so nothing here expects a file to change
; underneath it.

memory_limit = 256M

; A drawing is one JSON document saved whole, and an underlay is a rasterised page uploaded as
; an image. Both are larger than PHP's defaults expect and neither is large.
upload_max_filesize = 32M
post_max_size = 40M
max_execution_time = 60

expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16

; The files cannot change without a new image, so there is nothing to check for. This is the
; setting that makes the difference between a fast instance and a merely working one — and the
; reason a code change needs the container restarted rather than only reloaded.
opcache.validate_timestamps = 0
